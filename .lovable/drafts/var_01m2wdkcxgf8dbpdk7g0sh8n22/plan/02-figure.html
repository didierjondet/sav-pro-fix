<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-secondary); font-size: 12px; }
    .t { fill: var(--fg-primary); font-size: 14px; font-weight: 480; }
    .m { font-family: var(--font-mono); font-size: 11px; }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .acc { fill: var(--bg-accent-translucent); stroke: none; rx: 8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <text class="t" x="0" y="14">Aujourd'hui</text>
  <rect class="zone" x="0" y="26" width="290" height="120"/>
  <rect class="box" x="14" y="44" width="110" height="30"/>
  <text x="26" y="63">Chaque écran</text>
  <rect class="box" x="14" y="86" width="110" height="30"/>
  <text x="26" y="105">Chaque carte</text>
  <path class="wire" d="M124 59 H190" marker-end="url(#a)"/>
  <path class="wire" d="M124 101 H190" marker-end="url(#a)"/>
  <rect class="box" x="190" y="58" width="86" height="44"/>
  <text x="203" y="76">Serveur</text>
  <text class="m" x="203" y="92">saturé</text>
  <text class="m" x="14" y="136">rafraîchissement toutes les 10–30 s, en boucle</text>

  <text class="t" x="350" y="14">Après nettoyage</text>
  <rect class="zone" x="350" y="26" width="290" height="120"/>
  <rect class="box" x="364" y="44" width="110" height="30"/>
  <text x="376" y="63">Écran actif</text>
  <rect class="acc" x="364" y="86" width="110" height="30"/>
  <text x="376" y="105" fill="var(--fg-accent)">Temps réel ciblé</text>
  <path class="wire" d="M474 59 H540" marker-end="url(#a)"/>
  <path class="wire" d="M474 101 H540" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect class="box" x="540" y="58" width="86" height="44"/>
  <text x="553" y="76">Serveur</text>
  <text class="m" x="556" y="92">fluide</text>
  <text class="m" x="364" y="136">mise à jour à l'ouverture + notification de changement</text>

  <rect class="zone" x="0" y="168" width="640" height="112"/>
  <text class="t" x="16" y="192">Comportement en cas de lenteur serveur</text>
  <rect class="box" x="16" y="206" width="140" height="34"/>
  <text x="30" y="227">Requête trop lente</text>
  <path class="wire" d="M156 223 H214" marker-end="url(#a)"/>
  <rect class="box" x="214" y="206" width="170" height="34"/>
  <text x="228" y="227">Actuel : liste vide affichée</text>
  <path class="wire" d="M384 223 H442" marker-end="url(#a)"/>
  <rect class="acc" x="442" y="206" width="182" height="34"/>
  <text x="456" y="227" fill="var(--fg-accent)">Cible : données conservées</text>
  <text class="m" x="16" y="264">plus jamais d'écran « compte vide » : on garde l'affichage et on signale le souci</text>
</svg>
